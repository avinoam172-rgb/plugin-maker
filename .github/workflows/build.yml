name: build-plugin
run-name: "build ${{ inputs.id }} ${{ inputs.who }} ${{ inputs.kind }} ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      id:
        description: job id
        required: true
      who:
        description: requester user name
        required: true
      kind:
        description: plugin, forge or fabric
        required: false
        default: 'plugin'
      prompt:
        description: what to build
        required: true
      name:
        description: plugin or mod name (optional)
        required: false
        default: ''
      version:
        description: Minecraft version
        required: false
        default: '1.21.11'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Java 21 for Minecraft 1.21.x, Java 25 for 26.x and for the newer build tools.
      # Java 8 and 17 are used by some Forge setup tools. The last one listed is the default.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25

      - name: Cache Maven libraries (plugins)
        if: inputs.kind == 'plugin'
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: pm-maven-${{ inputs.version }}
          restore-keys: pm-maven-

      - name: Cache Gradle and Minecraft files (mods)
        if: inputs.kind != 'plugin'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pm-gradle-${{ inputs.kind }}-${{ inputs.version }}

      - name: Install Gradle (Fabric mods)
        if: inputs.kind == 'fabric'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.9.0'
          cache-disabled: true

      - name: Generate and compile
        env:
          JOB_ID: ${{ inputs.id }}
          KIND: ${{ inputs.kind }}
          PROMPT: ${{ inputs.prompt }}
          PLUGIN_NAME: ${{ inputs.name }}
          MC_VERSION: ${{ inputs.version }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_CHAIN: ${{ vars.AI_CHAIN }}
        run: node builder/build.mjs

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.id }}
        run: |
          if [[ ! "$JOB_ID" =~ ^[a-f0-9]{12}$ ]]; then echo "bad id"; exit 1; fi
          mkdir -p out
          if [ ! -f out/result.json ]; then
            echo '{"ok":false,"error":"הבנייה נכשלה בגלל תקלה פנימית. נסו שוב."}' > out/result.json
          fi
          shopt -s nullglob
          files=(out/*.jar out/*.zip)
          gh release create "b-$JOB_ID" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "build $JOB_ID" \
            --notes-file out/result.json
